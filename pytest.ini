[pytest]
# Standalone Lethe test suite. Tool modules are loaded either by path (importlib)
# or via this pythonpath entry, so no install/packaging step is required.
pythonpath = .
# Unicorn catches Windows access-violation probes internally; disable pytest's
# faulthandler plugin so successful oracle runs do not emit misleading crash dumps.
addopts = -p no:faulthandler
testpaths =
    tests
norecursedirs =
    .git
    .venv
    build
    build_*
    stub/build
    tests/build
markers =
    slow: expensive offline regression gates (native stub round-trip / framedump replay). Deselect with -m "not slow".
