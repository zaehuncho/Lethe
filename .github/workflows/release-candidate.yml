name: stage native release candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full committed source SHA to reproduce
        required: true
        type: string
      shuffle_seed:
        description: Exact 64-character lowercase hexadecimal Daedalus shuffle seed
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LETHE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      LETHE_SHUFFLE_SEED: ${{ inputs.shuffle_seed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:LETHE_SOURCE_COMMIT -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'source_commit must be a full lowercase 40-character commit SHA'
          }
          if ($env:LETHE_SHUFFLE_SEED -cnotmatch '\A[0-9a-f]{64}\z') {
            throw 'shuffle_seed must be exactly 64 lowercase hexadecimal characters'
          }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse failed' }
          $actual = $actual.Trim()
          if ($actual -cne $env:LETHE_SOURCE_COMMIT) {
            throw "Checkout mismatch: expected $env:LETHE_SOURCE_COMMIT, got $actual"
          }
          Write-Output 'Workflow inputs and checkout verified.'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.29
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --group dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage candidate under pinned blocker policy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stageDir = Join-Path $env:RUNNER_TEMP 'lethe-native-candidate'
          .\.venv\Scripts\python.exe .\tools\promote_stub.py `
            --source-commit $env:LETHE_SOURCE_COMMIT `
            --shuffle-seed $env:LETHE_SHUFFLE_SEED `
            --stage-dir $stageDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lethe-native-candidate-${{ inputs.source_commit }}
          path: ${{ runner.temp }}\lethe-native-candidate
          if-no-files-found: error
          retention-days: 14
