name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Slow gates (native stub round-trip / framedump replay) need an MSVC
      # toolchain and are excluded here; this runs the offline correctness suite
      # (packer ABI, cipher RFC vectors, VM, lifter oracle, bind, tracing, bounty).
      - name: Run test suite
        run: python -m pytest -m "not slow" -q
