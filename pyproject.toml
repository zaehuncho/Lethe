[project]
name = "lethe-build-tools"
version = "0.1.0"
description = "Build-time tooling for the Lethe first-party PE protector"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "zaehuncho" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2026.6.17,<2027",
    "cryptography>=50.0.1,<51",
    "lief>=1,<2",
]

[dependency-groups]
dev = [
    "argon2-cffi>=23.1,<26",
    "iced-x86>=1.21,<2",
    "keystone-engine>=0.9.2,<0.10",
    "pytest>=9.1,<10",
    "pyside6>=6.11,<6.12",
    "unicorn>=2.1.4,<3",
]
gui-build = [
    "nuitka>=4.1.3,<5",
    "pyside6>=6.11,<6.12",
]

[tool.uv]
package = false

[project.urls]
Homepage = "https://github.com/zaehuncho/Lethe"
Repository = "https://github.com/zaehuncho/Lethe.git"
Issues = "https://github.com/zaehuncho/Lethe/issues"
Security = "https://github.com/zaehuncho/Lethe/security/advisories/new"
